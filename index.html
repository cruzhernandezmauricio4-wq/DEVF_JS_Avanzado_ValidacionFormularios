<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Zod</title>
  <!-- Importamos Zod desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }
    form {
      width: 50%;
      margin: auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #errors {
      color: red;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Registro de Usuario</h1>
  <form id="registerForm">
    <label for="name">Nombre:</label>
    <input type="text" id="name" placeholder="Tu nombre" required />

    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" placeholder="Tu correo" required />

    <label for="password">Contraseña:</label>
    <input type="password" id="password" placeholder="Contraseña" required />

    <button type="submit">Registrar</button>
  </form>

  <p id="errors"></p>

  <script>
    // Importamos Zod
    const { z } = window.Zod;

    // Esquema para validar los datos del formulario
    const registerSchema = z.object({
      // Nombre: cadena no vacía, mínimo 3 caracteres
      name: z.string().min(3, { message: "El nombre debe tener al menos 3 caracteres." }),
      // Correo: formato válido
      email: z.string().email({ message: "El correo electrónico no es válido." }),
      // Contraseña: mínimo 6 caracteres
      password: z.string().min(6, { message: "La contraseña debe tener al menos 6 caracteres." })
    });

    document.getElementById("registerForm").addEventListener("submit", (event) => {
      event.preventDefault();
      
      // Capturamos los valores ingresados
      const formData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      };

      try {
        // Validamos con Zod
        registerSchema.parse(formData);
        document.getElementById("errors").textContent = "";
        alert("¡Registro exitoso!");
      } catch (error) {
        // Mostramos los mensajes de error en la página
        document.getElementById("errors").textContent = error.errors.map(e => e.message).join(" | ");
      }
    });

</html>
